name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.3.0)"
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - run: uv venv --python 3.12 .venv

      - run: uv pip install --python .venv/bin/python .

      - run: uv pip install --python .venv/bin/python pex

      - name: Build
        run: |
          .venv/bin/pex --venv-repository .venv --venv --scie eager --scie-pbs-stripped \
              --scie-platform linux-x86_64 -e mcp_server_mattermost:main \
              -o mcp-server-mattermost

      - name: Tag & Upload
        run: |
          TAG="${{ inputs.tag || github.event.release.tag_name }}"
          chmod +x mcp-server-mattermost
          gh release create "$TAG" --generate-notes || true
          gh release upload "$TAG" mcp-server-mattermost --clobber
          sha256sum mcp-server-mattermost > mcp-server-mattermost.sha256
          gh release upload "$TAG" mcp-server-mattermost.sha256 --clobber
