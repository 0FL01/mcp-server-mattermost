name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.3.0)"
        required: true
        type: string
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - run: uv venv --python 3.12 .venv

      - name: Install deps
        run: |
          uv pip install --python .venv/bin/python \
            fastmcp httpx pydantic pydantic-settings tenacity wsproto cachetools

      - run: uv pip install --python .venv/bin/python .

      - run: uv tool install pex

      - name: Build PEX
        run: |
          uv run pex --venv-repository .venv --scie eager --scie-pbs-stripped \
              --scie-platform linux-x86_64 -c mcp-server-mattermost \
              -o mcp-server-mattermost

      - run: chmod +x mcp-server-mattermost

      - name: Get tag
        id: tag
        run: |
          TAG=${{ github.event.inputs.tag || github.event.release.tag_name }}
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create release
        if: github.event_name == 'workflow_dispatch'
        run: |
          gh release create ${{ steps.tag.outputs.tag }} --generate-notes || true

      - run: gh release upload ${{ steps.tag.outputs.tag }} mcp-server-mattermost --clobber

      - run: |
          sha256sum mcp-server-mattermost > mcp-server-mattermost.sha256
          gh release upload ${{ steps.tag.outputs.tag }} mcp-server-mattermost.sha256 --clobber
